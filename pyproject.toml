[project]
name = "stable-diffusion-server-lowram"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
  "accelerate>=0.33,<1",
  "boto3>=1.34",
  "cachetools>=4.2",
  "diffusers==0.30.1",
  "fastapi>=0.100,<1",
  "huggingface-hub>=0.24,<1",
  "peft>=0.12,<1",
  "pillow>=10,<12",
  "python-multipart>=0.0.6",
  "safetensors>=0.4",
  "torch==2.4.1",
  "transformers>=4.43,<5",
  "uvicorn[standard]>=0.30,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
